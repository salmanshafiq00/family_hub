name: family_hub
description: Family Hub - Bangla-first household bazar and chores app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  android_intent_plus: ^6.1.0
  animations: ^3.0.0
  characters: ^1.4.1
  cloud_firestore: 7.0.0
  csv: ^8.0.0
  firebase_auth: 7.0.0
  firebase_core: 5.0.0
  # FCM client adapter (P4-14); resolved with firebase_core 5.0.0.
  firebase_messaging: ^17.0.0
  # Charts for the reports screen (P2-25, D-P2-15).  Pinned to the current
  # stable; it needs Dart >= 3.6.2 / Flutter >= 3.27.4, which this app exceeds.
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_slidable: ^4.0.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.0
  intl: ^0.20.3
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Light.ttf
          weight: 300
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
